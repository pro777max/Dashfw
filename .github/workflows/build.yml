name: Build ESP32-P4
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32p4
          command: |
            git config --global --add safe.directory /__w/Dashfw/Dashfw
            rm -f sdkconfig
            idf.py fullclean
            idf.py build
      
      - name: Create merged binary
        run: |
          cd build
          # Создаём полный merged bin из отдельных компонентов
          python3 /opt/esp/idf/components/esptool_py/esptool/esptool.py \
            --chip esp32p4 \
            merge_bin \
            -o dash_merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 dash.bin
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash_merged
          path: build/dash_merged.bin
          retention-days: 7
