name: Build ESP32-P4

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ESP-IDF Build (v5.5.3 / esp32p4)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32p4
          command: |
            git config --global --add safe.directory /__w/Dashfw/Dashfw
            rm -f sdkconfig dependencies.lock
            idf.py set-target esp32p4
            idf.py build
            idf.py size
            esptool.py --chip esp32p4 merge_bin \
              -o dash_merged.bin \
              --flash_mode qio --flash_freq 80m --flash_size 16MB \
              0x2000  build/bootloader/bootloader.bin \
              0x8000  build/partition_table/partition-table.bin \
              0x10000 build/dash.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash_merged
          path: dash_merged.bin
          retention-days: 7

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          files: dash_merged.bin
          prerelease: true