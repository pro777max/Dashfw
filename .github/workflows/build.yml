name: Build ESP32-P4
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32p4
          command: |
            git config --global --add safe.directory /__w/Dashfw/Dashfw
            chmod +x patch_bsp.sh
            ./patch_bsp.sh
            idf.py build
